<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Items')}"></head>
<body>
<header th:replace="~{fragments :: header(${user}, 'items')}"></header>
<main>
    <div th:replace="~{fragments :: flash}"></div>

    <div class="page-head">
        <div>
            <h1 th:text="${user.admin} ? 'All listed items' : 'Browse items'">Browse items</h1>
            <p th:unless="${user.admin}">Request an Available item. The owner approves it and sets the due date.</p>
            <p th:if="${user.admin}">Every item listed by students and org officers, with its current status.</p>
        </div>
        <a class="btn accent" th:href="@{/lend}" th:unless="${user.admin}">+ Lend an item</a>
    </div>

    <form method="get" th:action="@{/items}" class="searchbar">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Search by name or description">
        <select name="category">
            <option value="">All categories</option>
            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}" th:selected="${c == category}"></option>
        </select>
        <button type="submit">Search</button>
    </form>

    <div class="grid">
        <div class="card item" th:each="item : ${items}">
            <div class="item-top">
                <span class="icon" th:classappend="${#strings.replace(#strings.toLowerCase(item.category), ' ', '-')}"
                      th:text="${item.category == 'Calculator'} ? '🧮' : (${item.category == 'Charger'} ? '🔌' : '🔧')">🔧</span>
                <div class="grow">
                    <div class="row between">
                        <h3 th:text="${item.name}">Item</h3>
                        <span class="badge" th:classappend="${'b-' + #strings.toLowerCase(item.status)}"
                              th:text="${item.status}">Available</span>
                    </div>
                    <div class="faint small" th:text="${item.category + ' · up to ' + item.maxBorrowDays + ' day(s)'}"></div>
                </div>
            </div>
            <p class="desc" th:if="${!#strings.isEmpty(item.description)}" th:text="${item.description}"></p>
            <div class="owner">
                Owner: <strong th:text="${item.owner.fullName}">Name</strong>
                · <span th:text="${item.owner.profile.contactInfo}">contact</span>
            </div>
            <div class="actions">
                <span class="mine" th:if="${item.isOwnedBy(user)}">This is your item</span>
                <form method="post" th:action="@{/items/request}" class="row"
                      th:if="${!item.isOwnedBy(user) and !user.admin and item.available}">
                    <input type="hidden" name="itemId" th:value="${item.id}">
                    <input type="number" name="days" min="1" th:max="${item.maxBorrowDays}"
                           th:value="${item.maxBorrowDays}" title="Days">
                    <span class="faint small">day(s)</span>
                    <button type="submit" class="sm">Request</button>
                </form>
                <span class="faint small" th:if="${!item.isOwnedBy(user) and !user.admin and !item.available}">Not available right now</span>
            </div>
        </div>
    </div>

    <div class="card empty" th:if="${#lists.isEmpty(items)}">
        <div class="big">🔍</div>
        <p>No items match your search.</p>
    </div>
</main>
</body>
</html>
