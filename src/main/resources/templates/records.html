<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Records')}"></head>
<body>
<header th:replace="~{fragments :: header(${user}, 'records')}"></header>
<main>
    <div th:replace="~{fragments :: flash}"></div>

    <div class="page-head">
        <div>
            <h1 th:text="${user.admin} ? 'All lending records' : 'My lending records'">Records</h1>
            <p th:unless="${user.admin}">Items you borrowed and items you lent. Only the owner can mark an item returned.</p>
            <p th:if="${user.admin}">Every approved borrow in the system. Overdue items are flagged for follow-up.</p>
        </div>
    </div>

    <div class="alert bad" th:if="${overdueCount > 0}">
        <strong th:text="${overdueCount + ' overdue'}">1 overdue</strong>
        <span>item(s) need follow-up. <a th:href="@{/records(filter='overdue')}">Show overdue</a></span>
    </div>

    <nav class="tabs">
        <a th:each="f : ${filters}" th:href="@{/records(filter=${f})}"
           th:text="${#strings.capitalize(f)}" th:classappend="${f == filter} ? 'on'"></a>
    </nav>

    <div class="card" th:each="r : ${records}" th:classappend="${r.overdue} ? 'is-overdue'">
        <div class="rec">
            <div class="grow">
                <div class="row">
                    <strong th:text="${r.item.name}">Item</strong>
                    <span class="badge"
                          th:classappend="${'b-' + #strings.replace(#strings.toLowerCase(r.statusLabel), ' ', '-')}"
                          th:text="${r.statusLabel}"></span>
                    <span class="chip" th:unless="${user.admin}"
                          th:text="${r.isLentBy(user)} ? 'You lent this' : 'You borrowed this'"></span>
                </div>
                <div class="people">
                    <b>Borrower</b><span th:text="${r.borrower.fullName + ' · ' + r.borrower.profile.contactInfo}">b</span>
                    <b>Owner</b><span th:text="${r.lender.fullName + ' · ' + r.lender.profile.contactInfo}">o</span>
                </div>
                <div class="timeline">
                    <div><small>Borrowed</small><span th:text="${r.borrowDate}">date</span></div>
                    <div><small>Due</small><span th:text="${r.dueDate}" th:style="${r.overdue} ? 'color:var(--bad);font-weight:700'">date</span></div>
                    <div th:if="${r.returnDate != null}"><small>Returned</small><span th:text="${r.returnDate}">date</span></div>
                </div>
            </div>
            <form method="post" th:action="@{/records/return}" th:if="${r.active and r.isLentBy(user)}">
                <input type="hidden" name="recordId" th:value="${r.id}">
                <button type="submit" class="ok">Mark returned</button>
            </form>
        </div>
    </div>
    <div class="card empty" th:if="${#lists.isEmpty(records)}"><p>No records here.</p></div>
</main>
</body>
</html>
