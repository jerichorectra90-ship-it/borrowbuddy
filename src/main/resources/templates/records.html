<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Records · BorrowBuddy</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header th:replace="~{fragments :: header(${user})}"></header>
<main>
    <div class="msg" th:if="${message}" th:text="${message}"></div>

    <h2 th:text="${user.admin} ? 'All lending records' : 'My lending records'">Records</h2>
    <p class="muted small" th:unless="${user.admin}">Items you borrowed and items you lent. Only the owner can mark an item returned.</p>

    <div class="error" th:if="${overdueCount > 0}" th:text="${overdueCount + ' overdue item(s) need follow-up.'}"></div>

    <nav class="tabs">
        <a th:each="f : ${filters}" th:href="@{/records(filter=${f})}"
           th:text="${#strings.capitalize(f)}" th:classappend="${f == filter} ? 'on'"></a>
    </nav>

    <div class="card" th:each="r : ${records}">
        <div class="row top">
            <div class="grow">
                <strong th:text="${r.item.name}">Item</strong>
                <span class="badge"
                      th:classappend="${'b-' + #strings.replace(#strings.toLowerCase(r.statusLabel), ' ', '-')}"
                      th:text="${r.statusLabel}"></span>
                <div class="muted" th:text="${'Borrower: ' + r.borrower.fullName + ' (' + r.borrower.profile.contactInfo + ')'}"></div>
                <div class="muted" th:text="${'Owner: ' + r.lender.fullName + ' (' + r.lender.profile.contactInfo + ')'}"></div>
                <div class="muted small"
                     th:text="${'Borrowed ' + r.borrowDate + ' · Due ' + r.dueDate + (r.returnDate != null ? ' · Returned ' + r.returnDate : '')}"></div>
            </div>
            <form method="post" th:action="@{/records/return}" th:if="${r.active and r.isLentBy(user)}">
                <input type="hidden" name="recordId" th:value="${r.id}">
                <button type="submit">Mark returned</button>
            </form>
        </div>
    </div>
    <p class="muted" th:if="${#lists.isEmpty(records)}">No records here.</p>
</main>
</body>
</html>
