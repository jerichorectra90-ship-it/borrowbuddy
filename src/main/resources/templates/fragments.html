<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1d3a8a">
    <title th:text="${title + ' · BorrowBuddy'}">BorrowBuddy</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<!-- Top navigation. "active" highlights the current page. -->
<header th:fragment="header(user, active)" class="topbar">
    <div class="topbar-inner">
        <a class="brand" th:href="@{/}"><span class="logo">B</span>BorrowBuddy</a>

        <nav class="nav" th:if="${user.admin}">
            <a th:href="@{/admin}" th:classappend="${active == 'admin'} ? 'on'">Dashboard</a>
            <a th:href="@{/items}" th:classappend="${active == 'items'} ? 'on'">All items</a>
            <a th:href="@{/records}" th:classappend="${active == 'records'} ? 'on'">All records</a>
            <a th:href="@{/profile}" th:classappend="${active == 'profile'} ? 'on'">Profile</a>
        </nav>

        <nav class="nav" th:unless="${user.admin}">
            <a th:href="@{/items}" th:classappend="${active == 'items'} ? 'on'">Browse</a>
            <a th:href="@{/lend}" th:classappend="${active == 'lend'} ? 'on'">Lend an item</a>
            <a th:href="@{/requests}" th:classappend="${active == 'requests'} ? 'on'">Requests
                <span class="count" th:if="${navPending != null and navPending > 0}" th:text="${navPending}">1</span></a>
            <a th:href="@{/records}" th:classappend="${active == 'records'} ? 'on'">My records</a>
            <a th:href="@{/profile}" th:classappend="${active == 'profile'} ? 'on'">Profile</a>
        </nav>

        <div class="me">
            <a class="avatar" th:href="@{/profile}" title="Profile"
               th:text="${#strings.toUpperCase(#strings.substring(user.fullName, 0, 1))}">J</a>
            <span class="who"><span th:text="${user.fullName}">Name</span><small th:text="${user.role}">Role</small></span>
            <a class="logout" th:href="@{/logout}">Log out</a>
        </div>
    </div>

    <!-- Phone only: app-style bottom tab bar so every page is one tap away -->
    <nav class="tabbar" th:if="${user.admin}" aria-label="Main">
        <a th:href="@{/admin}" th:classappend="${active == 'admin'} ? 'on'">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
            <span>Dashboard</span></a>
        <a th:href="@{/items}" th:classappend="${active == 'items'} ? 'on'">
            <svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>
            <span>Items</span></a>
        <a th:href="@{/records}" th:classappend="${active == 'records'} ? 'on'">
            <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
            <span>Records</span></a>
        <a th:href="@{/profile}" th:classappend="${active == 'profile'} ? 'on'">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            <span>Profile</span></a>
    </nav>
    <nav class="tabbar" th:unless="${user.admin}" aria-label="Main">
        <a th:href="@{/items}" th:classappend="${active == 'items'} ? 'on'">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <span>Browse</span></a>
        <a th:href="@{/lend}" th:classappend="${active == 'lend'} ? 'on'">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg>
            <span>Lend</span></a>
        <a th:href="@{/requests}" th:classappend="${active == 'requests'} ? 'on'">
            <svg viewBox="0 0 24 24"><path d="M4 13l2-8h12l2 8v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/></svg>
            <span>Requests</span>
            <b class="dot" th:if="${navPending != null and navPending > 0}" th:text="${navPending}">1</b></a>
        <a th:href="@{/records}" th:classappend="${active == 'records'} ? 'on'">
            <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
            <span>Records</span></a>
        <a th:href="@{/profile}" th:classappend="${active == 'profile'} ? 'on'">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            <span>Profile</span></a>
    </nav>
</header>

<!-- Flash message shown after an action -->
<div th:fragment="flash" class="alert info" th:if="${message}" th:text="${message}"></div>

<!-- Role chip -->
<span th:fragment="role(u)" class="chip"
      th:classappend="${u.admin} ? 'admin' : (${#strings.startsWith(u.role, 'Org')} ? 'officer' : 'student')"
      th:text="${u.role}">Student</span>

</body>
</html>
