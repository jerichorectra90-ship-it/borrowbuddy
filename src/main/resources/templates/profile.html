<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Profile')}"></head>
<body>
<header th:replace="~{fragments :: header(${user}, 'profile')}"></header>
<main>
    <div th:replace="~{fragments :: flash}"></div>

    <div class="cols">
        <div class="card">
            <div class="profile-head">
                <span class="big-avatar" th:text="${#strings.toUpperCase(#strings.substring(user.fullName, 0, 1))}">J</span>
                <div>
                    <h1 th:text="${user.fullName}">Name</h1>
                    <span th:replace="~{fragments :: role(${user})}"></span>
                </div>
            </div>
            <dl class="details">
                <dt>UST-L account</dt><dd th:text="${user.ustlAccount}"></dd>
                <dt th:text="${user.admin} ? 'Staff ID' : 'Student ID'">ID</dt><dd th:text="${user.studentId ?: '—'}"></dd>
                <dt th:text="${user.admin} ? 'Office' : 'Course'">Course</dt><dd th:text="${user.profile.course}"></dd>
                <dt th:unless="${user.admin}">Year and block</dt>
                <dd th:unless="${user.admin}" th:text="${'Year ' + user.profile.yearLevel + ' · Block ' + user.profile.block}"></dd>
                <dt>Contact info</dt><dd th:text="${user.profile.contactInfo}"></dd>
                <dt>Borrow limit</dt>
                <dd th:text="${user.admin} ? 'Admin account (monitors records, does not borrow)' : ${user.borrowLimit + ' item(s) at a time'}"></dd>
            </dl>
        </div>

        <div class="card">
            <h2>Edit profile</h2>
            <form method="post" th:action="@{/profile}" class="stack" style="margin-top:12px">
                <label class="field">Course <input type="text" name="course" required th:value="${user.profile.course}"></label>
                <div class="two">
                    <label class="field">Year level
                        <select name="yearLevel">
                            <option th:each="y : ${#numbers.sequence(1, 5)}" th:value="${y}" th:text="${'Year ' + y}"
                                    th:selected="${y == user.profile.yearLevel}"></option>
                        </select>
                    </label>
                    <label class="field">Block <input type="text" name="block" required th:value="${user.profile.block}"></label>
                </div>
                <label class="field">Contact info <input type="text" name="contactInfo" required th:value="${user.profile.contactInfo}"></label>
                <button type="submit">Save changes</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
