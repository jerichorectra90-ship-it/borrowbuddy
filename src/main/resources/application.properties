server.port=${PORT:8080}

# supabase postgres - use the SESSION POOLER connection string# DB_URL example: jdbc:postgresql://aws-0-xx.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3

# tables get made automatically from the entity classes, no sql needed
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
